
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>

<style>
/* Basic page design */
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.game-container {
    width: 100%;
    max-width: 460px;
    text-align: center;
}

h1 {
    color: #62ff9b;
    font-size: 38px;
    margin-bottom: 8px;
}

.subtitle {
    color: #c5d4e5;
    margin-bottom: 20px;
}

.score-board {
    display: flex;
    justify-content: space-around;
    gap: 12px;
    margin-bottom: 15px;
}

.score-box {
    background: #263b53;
    padding: 12px;
    border-radius: 12px;
    flex: 1;
    border: 1px solid #49617b;
}

.score-box span {
    display: block;
    color: #62ff9b;
    font-size: 24px;
    font-weight: bold;
    margin-top: 5px;
}

/* Game canvas */
.game-area {
    position: relative;
    width: 100%;
    background: #101d2c;
    border: 4px solid #62ff9b;
    border-radius: 12px;
    overflow: hidden;
    touch-action: none;
}

canvas {
    display: block;
    width: 100%;
    height: auto;
}

/* Game message */
.message {
    margin: 15px 0;
    min-height: 24px;
    color: #ffd166;
    font-weight: bold;
}

/* Buttons */
.buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 12px;
}

button {
    background: #62ff9b;
    color: #142333;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #39df7b;
}

button:active {
    transform: scale(0.95);
}

/* Mobile direction controls */
.controls {
    display: grid;
    grid-template-columns: repeat(3, 60px);
    grid-template-rows: repeat(2, 55px);
    justify-content: center;
    gap: 7px;
    margin-top: 20px;
}

.controls button {
    padding: 8px;
    font-size: 22px;
}

.up {
    grid-column: 2;
}

.left {
    grid-column: 1;
    grid-row: 2;
}

.down {
    grid-column: 2;
    grid-row: 2;
}

.right {
    grid-column: 3;
    grid-row: 2;
}

.instructions {
    color: #c5d4e5;
    font-size: 14px;
    line-height: 1.7;
    margin-top: 20px;
}

@media (max-width: 400px) {
    h1 {
        font-size: 30px;
    }

    button {
        padding: 11px 16px;
    }
}
</style>
</head>

<body>

<div class="game-container">

    <h1>🐍 Snake Game</h1>
    <p class="subtitle">Eat apples and grow your snake!</p>

    <div class="score-board">
        <div class="score-box">
            SCORE
            <span id="score">0</span>
        </div>

        <div class="score-box">
            BEST SCORE
            <span id="bestScore">0</span>
        </div>
    </div>

    <div class="game-area">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
    </div>

    <div class="message" id="message">
        Press Start to play!
    </div>

    <div class="buttons">
        <button onclick="startGame()">▶ Start / Restart</button>
        <button onclick="togglePause()">⏸ Pause</button>
    </div>

    <!-- Mobile direction buttons -->
    <div class="controls">
        <button class="up" onclick="changeDirection('UP')">⬆️</button>
        <button class="left" onclick="changeDirection('LEFT')">⬅️</button>
        <button class="down" onclick="changeDirection('DOWN')">⬇️</button>
        <button class="right" onclick="changeDirection('RIGHT')">➡️</button>
    </div>

    <div class="instructions">
        <b>How to Play</b><br>
        🎮 Use Arrow Keys or WASD on your keyboard.<br>
        📱 Use the arrow buttons on your phone.<br>
        🍎 Eat apples to increase your score.<br>
        ⚠️ Avoid hitting the wall or yourself!
    </div>

</div>

<script>
// Get HTML elements
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const scoreElement = document.getElementById("score");
const bestElement = document.getElementById("bestScore");
const message = document.getElementById("message");

// Game settings
const box = 20;
const totalBoxes = canvas.width / box;

let snake;
let food;
let direction;
let nextDirection;
let score = 0;

let gameInterval = null;
let gameRunning = false;
let paused = false;
let gameOver = false;

// Load best score from browser storage
let bestScore = Number(localStorage.getItem("snakeBest")) || 0;
bestElement.textContent = bestScore;

// Create a new food position
function createFood() {
    let position;

    do {
        position = {
            x: Math.floor(Math.random() * totalBoxes),
            y: Math.floor(Math.random() * totalBoxes)
        };
    } while (snake.some(part =>
        part.x === position.x && part.y === position.y
    ));

    food = position;
}

// Start or restart the game
function startGame() {
    clearInterval(gameInterval);

    snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
    ];

    direction = "RIGHT";
    nextDirection = "RIGHT";

    score = 0;
    scoreElement.textContent = score;

    gameRunning = true;
    paused = false;
    gameOver = false;

    createFood();
    message.textContent = "Good luck! 🍎";

    drawGame();

    gameInterval = setInterval(gameLoop, 120);
}

// Main game loop
function gameLoop() {
    if (!gameRunning || paused) return;

    direction = nextDirection;

    // Get new head position
    const head = {
        x: snake[0].x,
        y: snake[0].y
    };

    if (direction === "UP") head.y--;
    if (direction === "DOWN") head.y++;
    if (direction === "LEFT") head.x--;
    if (direction === "RIGHT") head.x++;

    // Check wall collision
    if (
        head.x < 0 ||
        head.y < 0 ||
        head.x >= totalBoxes ||
        head.y >= totalBoxes
    ) {
        endGame();
        return;
    }

    // Check whether food is eaten
    const ateFood =
        head.x === food.x && head.y === food.y;

    // Check collision with snake body
    const bodyToCheck = ateFood
        ? snake
        : snake.slice(0, -1);

    if (bodyToCheck.some(part =>
        part.x === head.x && part.y === head.y
    )) {
        endGame();
        return;
    }

    // Add new head
    snake.unshift(head);

    if (ateFood) {
        score += 10;
        scoreElement.textContent = score;

        // Update best score
        if (score > bestScore) {
            bestScore = score;
            bestElement.textContent = bestScore;
            localStorage.setItem("snakeBest", bestScore);
        }

        createFood();
    } else {
        // Remove tail if food was not eaten
        snake.pop();
    }

    drawGame();
}

// Draw everything on canvas
function drawGame() {
    // Background
    ctx.fillStyle = "#101d2c";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Draw grid
    ctx.strokeStyle = "#20354a";
    ctx.lineWidth = 1;

    for (let i = 0; i <= canvas.width; i += box) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
    }

    // Draw food
    ctx.fillStyle = "#ff5252";
    ctx.beginPath();
    ctx.arc(
        food.x * box + box / 2,
        food.y * box + box / 2,
        box / 2 - 2,
        0,
        Math.PI * 2
    );
    ctx.fill();

    // Draw snake
    snake.forEach((part, index) => {
        ctx.fillStyle = index === 0 ? "#b5ff57" : "#45df86";

        ctx.fillRect(
            part.x * box + 1,
            part.y * box + 1,
            box - 2,
            box - 2
        );
    });

    // Draw eyes on snake head
    const head = snake[0];
    ctx.fillStyle = "#102030";

    const eyeX = head.x * box;
    const eyeY = head.y * box;

    if (direction === "RIGHT" || direction === "LEFT") {
        ctx.fillRect(eyeX + 6, eyeY + 5, 3, 3);
        ctx.fillRect(eyeX + 6, eyeY + 12, 3, 3);
    } else {
        ctx.fillRect(eyeX + 5, eyeY + 6, 3, 3);
        ctx.fillRect(eyeX + 12, eyeY + 6, 3, 3);
    }
}

// Change snake direction
function changeDirection(newDirection) {
    if (!gameRunning || paused || gameOver) return;

    const opposite = {
        UP: "DOWN",
        DOWN: "UP",
        LEFT: "RIGHT",
        RIGHT: "LEFT"
    };

    if (newDirection !== opposite[direction]) {
        nextDirection = newDirection;
    }
}

// Keyboard controls
document.addEventListener("keydown", function(event) {
    const keys = {
        ArrowUp: "UP",
        ArrowDown: "DOWN",
        ArrowLeft: "LEFT",
        ArrowRight: "RIGHT",
        w: "UP",
        s: "DOWN",
        a: "LEFT",
        d: "RIGHT"
    };

    if (keys[event.key]) {
        event.preventDefault();
        changeDirection(keys[event.key]);
    }

    if (event.key === " " && gameRunning) {
        event.preventDefault();
        togglePause();
    }
});

// Pause and resume
function togglePause() {
    if (!gameRunning || gameOver) return;

    paused = !paused;

    message.textContent = paused
        ? "Game Paused ⏸"
        : "Keep Playing! 🐍";
}

// Game over
function endGame() {
    clearInterval(gameInterval);

    gameRunning = false;
    gameOver = true;

    message.textContent = "Game Over! Your Score: " + score + " 🎮";
}

// Initial screen
snake = [
    { x: 10, y: 10 },
    { x: 9, y: 10 },
    { x: 8, y: 10 }
];

direction = "RIGHT";
nextDirection = "RIGHT";

createFood();
drawGame();

</script>

</body>
</html>
